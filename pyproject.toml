[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-config-drift"
version = "0.1.0"
description = "Read-only configuration drift detection for Cisco IOS / IOS-XE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Arkadiy Ayrapetov" }]
dependencies = ["netmiko>=4.3"]
keywords = ["cisco", "ios-xe", "netmiko", "configuration", "drift", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Networking",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/korpus91/cisco-config-drift"
Issues = "https://github.com/korpus91/cisco-config-drift/issues"

[project.scripts]
cisco-drift = "drift:main"

[tool.setuptools]
py-modules = ["drift"]